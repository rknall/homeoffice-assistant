name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow runs the same jobs before it builds an image
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # uv never re-resolves in CI: uv.lock is the source of truth
  UV_FROZEN: "1"
  UV_PYTHON: "3.14"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: test-secret-key-for-ci-testing-only-32!
      DATABASE_URL: sqlite:///./test.db
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Check plugin dependencies
        run: uv run python -m scripts.plugin_deps

      - name: Create static directory
        run: mkdir -p static/assets

      - name: Run tests
        run: uv run --extra dev pytest --cov=src --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
        continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run linter
        run: uv run --extra dev ruff check .

      - name: Check formatting
        run: uv run --extra dev ruff format --check .

  migrations:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: test-secret-key-for-ci-testing-only-32!
      DATABASE_URL: sqlite:///./alembic-check.db
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Upgrade to head
        run: uv run alembic upgrade head

      - name: Check models match migrations
        run: uv run alembic check

      - name: Downgrade to base
        run: uv run alembic downgrade base

      - name: Upgrade to head again
        run: uv run alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The bun version is the packageManager field of package.json
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend

      # The API types are generated from the backend schema: a diff means the
      # committed file is stale (run `bun run gen:types` in frontend/)
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --extra dev --frozen

      - name: Check generated API types
        env:
          SECRET_KEY: test-secret-key-for-ci-testing-only-32!
          DATABASE_URL: sqlite:///./test.db
        run: |
          mkdir -p ../static/assets
          bun run gen:types
          git diff --exit-code src/types/api.generated.ts
        working-directory: frontend

      # Biome runs at the exact version pinned in package.json
      - name: Run Biome
        run: bun run lint
        working-directory: frontend

      - name: Build frontend
        run: bun run build
        working-directory: frontend

      - name: Run tests
        run: bun run test
        working-directory: frontend

  dockerfile-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

  # Builds the image without pushing when deployment inputs change in a PR
  docker-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect deployment input changes
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qE '^(docker/|pyproject\.toml$|uv\.lock$|frontend/package\.json$|frontend/bun\.lock$|alembic/)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.changed.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build image
        if: steps.changed.outputs.build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
